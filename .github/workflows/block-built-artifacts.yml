name: Block built artifacts in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-built-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect built artifacts
        id: detect
        run: |
          set -euo pipefail
          echo "Checking for banned build files..."
          # List files changed in the PR
          files=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD || true)
          echo "Changed files:\n$files"
          banned_patterns='(^assets/)|(^dist/)|(^index.html$)|(^cake-favicon.png$)|(^cake-site-favicon.png$)'
          if echo "$files" | egrep -q "$banned_patterns"; then
            echo "Found banned built artifacts in PR:" >&2
            echo "$files" | egrep -n "$banned_patterns" >&2
            exit 1
          fi
          echo "No built artifacts found."

      - name: Success message
        if: success()
        run: echo "PR is clean of built artifacts."
